/* US business card 3.5in x 2in + 0.125in bleed all around = 3.75in x 2.25in */
@page { size: 3.75in 2.25in; margin: 0; }
html,body { margin:0; padding:0; }
body { width:3.75in; height:2.25in; overflow:hidden;
  background:radial-gradient(ellipse 90% 130% at 50% -20%, #FDE8EE 0%, #FDF5F0 70%);
  display:flex; align-items:center; justify-content:center; }
.inner { text-align:center; }
.mark { width:1.05in; height:1.05in; display:block; margin:0 auto .04in; }
.name { font-family:'Cormorant Garamond',serif; font-weight:500; font-size:19pt;
  letter-spacing:.16em; color:#3D1A3D; line-height:1.05; }
.name small { display:block; font-size:11.5pt; letter-spacing:.34em; margin-top:.02in;
  padding-left:.34em; /* optically center: trailing tracking */ }
.rule { width:.9in; height:1px; background:#F2B8C6; margin:.07in auto .06in; }
.sub .dot { font-size:1.6em; vertical-align:-.09em; line-height:0; }
.sub2 { margin-top:.035in; letter-spacing:.34em; padding-left:.34em; }
.sub { font-family:'Jost',sans-serif; font-weight:300; font-size:6.4pt;
  letter-spacing:.3em; color:#C4637E; text-transform:uppercase; padding-left:.3em; }
